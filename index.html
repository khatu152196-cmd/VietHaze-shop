<style>

trung:{code:'0234',n:'ẠM',r:'Miền Trung',d:'Chắt lọc từ sự mộc mạc, kiên cường và sâu lắng của mảnh đất Cố đô đầy nắng gió – giao thoa giữa nét trầm tư cổ kính và sự an yên, vững chãi của núi rừng miền Trung.'},
nam:{code:'028',n:'ÊM',r:'Miền Nam',d:'Phóng khoáng, ngọt ngào nhưng cũng đầy dịu dàng, bao dung như nhịp sống phương Nam. "ÊM" vỗ về tâm hồn bằng sự tươi mới, mộc mạc của miệt vườn sông nước.'}};
const P=[
{id:'024-que',t:'bac',s:'Quế',tag:'Ấm áp & Quyến rũ',c:'#a0522d',d:'Gói trọn cái tình nồng hậu của miền Bắc những ngày trở gió. Nốt hương quế chi ấm nồng hòa quyện cùng chút ngọt dịu của sáp ong tự nhiên, đánh thức mọi giác quan và sưởi ấm tâm hồn. Phù hợp cho những ngày mưa lạnh, những buổi hẹn hò tối hoặc khi bạn cần một mùi hương chững chạc, cuốn hút.'},
{id:'024-nhai',t:'bac',s:'Nhài',tag:'Thanh khiết & Tinh tế',c:'#e9dfb8',d:'Như một sớm mai thức giấc bên hiên nhà cổ Hà Nội, nơi những đóa hoa nhài trắng muốt vừa hé nở trong sương. Mùi hương thuần khiết, nhẹ nhàng nhưng có độ lưu luyến sâu sắc, dành cho những tâm hồn yêu nét đẹp truyền thống, thanh lịch và bình yên.'},
{id:'0234-tram',t:'trung',s:'Tràm Gió',tag:'An yên & Mộc mạc',c:'#5f8f5a',d:'Mang theo hơi thở của núi rừng và những ký ức tuổi thơ êm đềm xứ Huế. Tinh dầu tràm gió tự nhiên tạo nên một nốt hương thảo mộc thanh sạch, dễ chịu, giúp giải tỏa mệt mỏi tức thì và mang lại cảm giác an toàn, được che chở như vòng tay của người thân.'},
{id:'0234-thong',t:'trung',s:'Gỗ Thông',tag:'Trầm tĩnh & Sâu lắng',c:'#3f6b4a',d:'Gợi nhắc những đồi thông xanh ngắt ẩn hiện trong làn sương mờ của đất Cố đô. Mùi gỗ thông mộc mạc, hơi se lạnh và trầm ấm mang đến sự tĩnh tại tuyệt đối cho tâm trí, lý tưởng cho những ai yêu phong cách tối giản, sâu sắc và gần gũi thiên nhiên.'},
{id:'028-tao',t:'nam',s:'Táo',tag:'Tươi mới & Phóng khoáng',c:'#9acd32',d:'Đại diện cho nguồn năng lượng tích cực, trẻ trung và cởi mở của nhịp sống phương Nam. Hương táo xanh giòn tan, ngọt dịu nhẹ nhàng mang lại cảm giác sảng khoái, tươi tắn suốt cả ngày dài, giúp bạn xua tan sự ngột ngạt và luôn rạng rỡ.'},
{id:'028-sen',t:'nam',s:'Hoa Sen',tag:'Dịu dàng & Thuần khiết',c:'#e8a0bf',d:'Chắt lọc tinh túy từ những đầm sen thanh tịnh của vùng sông nước Nam Bộ. Mùi hương hoa sen thoang thoảng, thanh cao và êm ái như một bản nhạc không lời, giúp cân bằng cảm xúc, mang lại sự thư thái và nét duyên dáng rất đỗi Việt Nam.'}];
P.forEach(p=>{p.code=T[p.t].code;p.name=`[${p.code}] ${T[p.t].n} - Sáp nước hoa hương ${p.s}`});
const $=s=>document.querySelector(s),money=n=>n.toLocaleString('vi-VN')+'đ';
let cart={},orders=[];try{cart=JSON.parse(localStorage.getItem('vh_cart')||'{}');orders=JSON.parse(localStorage.getItem('vh_orders')||'[]')}catch(e){}

const V={
home:()=>`<section class="hero"><div class="big">Viet<i>H</i>aze</div><p>Mùi hương là đầu câu chuyện… Sáp nước hoa thủ công mang ký ức ba miền trở về trên làn da bạn.</p><a class="btn" href="#shop">Khám phá bộ sưu tập</a> <a class="btn o" style="background:#26643855;color:#fff;border-color:#fff" href="#about">Câu chuyện thương hiệu</a></section>
<section class="sec"><h2>Đường dây ký ức 3 miền</h2><p style="max-width:760px">Giữa những bộn bề và áp lực nơi phố thị, hy vọng chút hương thơm mộc mạc từ VietHaze sẽ như một "cuộc gọi" đường dài, kết nối bạn trở về với những ký ức thân thương nhất của quê nhà. Lấy cảm hứng từ mã vùng điện thoại bàn của ba miền, mỗi thỏi sáp là một trạm dừng chân cảm xúc.</p><div class="grid">${Object.keys(T).map(tcard).join('')}</div></section>
<section class="sec"><div class="grid">${[['🐝','Thủ công & Organic','Sáp ong, dầu dừa, vitamin E và tinh dầu nguyên chất. Không cồn, không chất bảo quản.'],['🤰','An toàn mọi đối tượng','Kể cả da nhạy cảm, mẹ bầu và mẹ bỉm sữa.'],['🎒','Nhỏ gọn 5g','Dạng thỏi vặn như thỏi son, bỏ túi mang đi mọi nơi.']].map(x=>`<div class="card"><div style="font-size:30px">${x[0]}</div><h3>${x[1]}</h3><p style="margin:0">${x[2]}</p></div>`).join('')}</div></section>`,
about:()=>`<h1>Về thương hiệu VietHaze</h1><div class="card" style="max-width:820px"><p>VietHaze là thương hiệu hương thơm thủ công được sáng lập tại Việt Nam với số lượng sản xuất giới hạn nhằm đảm bảo chất lượng nguyên bản nhất trong từng mẻ sáp.</p><p>Bằng cách kể những câu chuyện văn hóa và ký ức vùng miền thông qua khứu giác, VietHaze mong muốn mỗi mùi hương khi chạm lên da sẽ là một sợi dây gắn kết vô hình, giúp bạn tìm thấy sự bình yên, tự hào và cảm giác thân thuộc như được trở về nhà.</p><p>Cần tư vấn mùi hương hợp cá tính? Hãy chat với trợ lý ở góc phải màn hình hoặc nhắn trực tiếp cho VietHaze.</p></div>`,
shop:()=>`<h1>Sản phẩm</h1>${Object.keys(T).map(k=>`<div class="sec" style="margin-top:30px"><h2><a href="#${k}">[${T[k].code}] ${T[k].n}</a> <span class="pill">${T[k].r}</span></h2><div class="grid">${P.filter(p=>p.t==k).map(pcard).join('')}</div></div>`).join('')}`,
theme:k=>`<div class="crumb"><a href="#shop">Sản phẩm</a> / ${T[k].n}</div><div class="card"><div class="code" style="color:var(--honey)">MÃ VÙNG ${T[k].code} · ${T[k].r.toUpperCase()}</div><h1 style="font-size:clamp(48px,10vw,90px);margin:0">${T[k].n}</h1><p style="max-width:720px;margin:0">${T[k].d}</p></div><div class="grid">${P.filter(p=>p.t==k).map(pcard).join('')}</div><div style="display:flex;gap:10px;flex-wrap:wrap">${Object.keys(T).filter(x=>x!=k).map(x=>`<a class="btn o" href="#${x}">Chủ đề ${T[x].n} (${T[x].code})</a>`).join('')}</div>`,
prod:p=>{const rows=[['Kho','CÒN HÀNG'],['Thương hiệu','VietHaze'],['Kích cỡ','Size du lịch (nhỏ gọn, tiện mang theo)'],['Trọng lượng','5g / thỏi'],['Công thức','Dạng sáp (rắn)'],['Nồng độ hương','Eau De Parfum (EDP) – lưu hương dịu nhẹ 4–6 tiếng'],['Mùi hương','Hương '+p.s],['Giới tính','Unisex'],['Nhóm tuổi','Mọi lứa tuổi (an toàn cho mẹ bầu và mẹ bỉm sữa)'],['Loại phiên bản','Phiên bản giới hạn (thủ công, số lượng có hạn)'],['Kiểu đóng gói','Đơn (1 thỏi/hộp)'],['Hạn sử dụng','12 tháng kể từ ngày sản xuất (6 tháng sau khi mở nắp)'],['Xuất xứ','Việt Nam'],['Đơn vị sản xuất','Thương hiệu sáp nước hoa thủ công VietHaze'],['Gửi từ','Thành phố Hồ Chí Minh']];
return `<div class="crumb"><a href="#shop">Sản phẩm</a> / <a href="#${p.t}">${T[p.t].n}</a> / ${p.s}</div><div class="prod"><div class="pic">${bottle(p)}</div><div><span class="pill">${T[p.t].r} · ${p.code}</span><h1 style="margin-top:8px">${p.name}</h1><div style="color:var(--honey)">${p.tag}</div><div class="price">${money(PRICE)}</div><h3>Mô tả sản phẩm</h3><p>${p.d}</p><button class="btn" onclick="add('${p.id}')">Thêm vào giỏ</button> <a class="btn o" href="#cart">Xem giỏ hàng</a></div></div>
<div class="grid"><div class="card"><h3>Thành phần</h3><table><tr><td>Sáp ong</td><td>Nền sáp tự nhiên</td></tr><tr><td>Dầu dừa</td><td>Dưỡng ẩm, làm mềm da</td></tr><tr><td>Vitamin E</td><td>Dưỡng da</td></tr><tr><td>Tinh dầu ${p.s}</td><td>Nguyên chất</td></tr><tr><td>Khối lượng</td><td>5g / thỏi</td></tr></table><p style="font-size:13px">100% thiên nhiên – không chất bảo quản, không cồn, không phụ gia độc hại.</p></div>

<div class="card scroll"><h3>Chi tiết sản phẩm</h3><table>${rows.map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td></tr>`).join('')}</table></div>
<h2 class="sec">Mùi hương khác cùng chủ đề</h2><div class="grid">${P.filter(x=>x.t==p.t&&x.id!=p.id).map(pcard).join('')}</div>`},
policy:()=>`<h1>Chính sách bán hàng</h1><div class="grid">${[['Vận chuyển','Giao toàn quốc từ TP. Hồ Chí Minh. Nội thành 1–2 ngày, tỉnh khác 3–5 ngày. Miễn phí vận chuyển đơn từ 299.000đ.'],['Thanh toán','COD (nhận hàng trả tiền), chuyển khoản QR, hoặc cổng thanh toán điện tử (sandbox thử nghiệm).'],['Đổi trả','Đổi/trả trong 7 ngày nếu sản phẩm lỗi, hư hỏng khi vận chuyển hoặc giao sai mùi. Giữ nguyên hộp và chưa sử dụng.'],['Bảo quản','Tránh nhiệt độ cao và ánh nắng trực tiếp. Hạn dùng 12 tháng, dùng tốt nhất trong 6 tháng sau khi mở nắp.'],['Bảo mật','Thông tin khách hàng chỉ dùng để xử lý đơn hàng, không chia sẻ cho bên thứ ba.']].map(x=>`<div class="card"><h3>${x[0]}</h3><p style="margin:0">${x[1]}</p></div>`).join('')}</div>`,
cart:()=>{const ids=Object.keys(cart).filter(i=>cart[i]>0);if(!ids.length)return `<h1>Giỏ hàng</h1><p>Giỏ hàng đang trống.</p><a class="btn" href="#shop">Chọn mùi hương</a>`;
return `<h1>Giỏ hàng</h1><div class="card scroll"><table>${ids.map(i=>{const p=P.find(x=>x.id==i);return `<tr><td style="color:inherit">${p.name}</td><td class="qty"><button onclick="chg('${i}',-1)">−</button> ${cart[i]} <button onclick="chg('${i}',1)">+</button></td><td>${money(cart[i]*PRICE)}</td></tr>`}).join('')}</table><h3 style="text-align:right;margin-top:14px">Tổng: ${money(total())}</h3><div style="text-align:right"><a class="btn" href="#checkout">Thanh toán</a></div></div>`},
checkout:()=>{if(!total())return `<h1>Thanh toán</h1><p>Giỏ hàng trống.</p>`;return `<h1>Đặt hàng & thanh toán</h1><div class="prod" style="grid-template-columns:1fr 1fr"><form class="card" onsubmit="return pay(event)"><label>Họ tên</label><input id="fn" required><label>Số điện thoại</label><input id="fp" required pattern="[0-9]{9,11}"><label>Địa chỉ giao hàng</label><textarea id="fa" required rows="2"></textarea><label>Phương thức thanh toán</label><select id="fm" onchange="$('#cd').style.display=this.value=='card'?'block':'none'"><option value="cod">COD – Nhận hàng trả tiền</option><option value="bank">Chuyển khoản ngân hàng (QR)</option><option value="card">Cổng thanh toán điện tử (Sandbox)</option></select><div id="cd" style="display:none"><label>Số thẻ test (dùng 4242 4242 4242 4242)</label><input id="fc" placeholder="4242 4242 4242 4242"><label>Hết hạn / CVC bất kỳ</label><input placeholder="12/30 · 123"></div><button class="btn" id="pb">Xác nhận đặt hàng</button><div id="pm" style="margin-top:10px"></div></form><div class="card"><h3>Đơn của bạn</h3><table>${Object.keys(cart).filter(i=>cart[i]>0).map(i=>`<tr><td style="color:inherit">${P.find(x=>x.id==i).name} × ${cart[i]}</td><td>${money(cart[i]*PRICE)}</td></tr>`).join('')}</table><h3 style="text-align:right">Tổng: ${money(total())}</h3></div></div>`},
orders:()=>`<h1>Nhật ký đơn hàng thử nghiệm</h1><p>Đã ghi log <b style="color:var(--honey)">${orders.length}/5</b> đơn tối thiểu (chụp màn hình trang này làm minh chứng).</p><div class="card scroll">${orders.length?`<table style="font-size:13px"><tr><td>Mã đơn / Giờ</td><td>Khách</td><td>Sản phẩm</td><td>Thanh toán</td><td>Tổng</td></tr>${orders.map(o=>`<tr><td style="color:inherit"><b>${o.id}</b><br>${o.time}</td><td style="color:inherit">${o.name}<br>${o.phone}</td><td style="color:inherit">${o.items}</td><td style="color:inherit">${o.pay}<br><span class="ok">${o.st}</span></td><td style="color:inherit">${money(o.total)}</td></tr>`).join('')}</table><p><button class="btn o" onclick="if(confirm('Xóa toàn bộ log?')){orders=[];sv();render()}">Xóa log</button></p>`:'Chưa có đơn nào. Hãy thêm sản phẩm và đặt thử.'}</div>`};
const total=()=>Object.keys(cart).reduce((s,i)=>s+(cart[i]||0)*PRICE,0);
function add(id){cart[id]=(cart[id]||0)+1;sv();cc();location.hash='cart'}
function chg(id,d){cart[id]=Math.max(0,(cart[id]||0)+d);sv();cc();render()}
function cc(){$('#cc').textContent=Object.values(cart).reduce((a,b)=>a+b,0)}
function pay(e){e.preventDefault();const m=$('#fm').value,b=$('#pb'),pm=$('#pm');
if(m=='card'&&$('#fc').value.replace(/\s/g,'')!='4242424242424242'){pm.innerHTML='<span class="err">Sandbox: thẻ bị từ chối. Hãy dùng thẻ test 4242 4242 4242 4242.</span>';return false}
b.disabled=true;pm.textContent=m=='card'?'Đang kết nối cổng thanh toán sandbox…':'Đang tạo đơn…';
setTimeout(()=>{const o={id:'VH'+Date.now().toString().slice(-7),time:new Date().toLocaleString('vi-VN'),name:$('#fn').value,phone:$('#fp').value,items:Object.keys(cart).filter(i=>cart[i]>0).map(i=>`${P.find(x=>x.id==i).name} ×${cart[i]}`).join('<br>'),total:total(),pay:{cod:'COD',bank:'Chuyển khoản QR',card:'Cổng sandbox'}[m],st:m=='cod'?'Chờ giao – thu hộ':'Thanh toán thành công (sandbox)'};
orders.unshift(o);cart={};sv();cc();$('#app').innerHTML=`<div class="card" style="text-align:center"><h1>🎉 Đặt hàng thành công</h1><p>Mã đơn <b style="color:var(--honey)">${o.id}</b> · ${o.st}</p><p>Cảm ơn bạn đã chọn VietHaze!</p><a class="btn" href="#orders">Xem nhật ký đơn</a> <a class="btn o" href="#shop">Tiếp tục mua</a></div>`},1000);return false}
function render(){const h=(location.hash||'#home').slice(1);let html;
if(T[h])html=V.theme(h);else if(h.startsWith('p-')&&P.find(p=>p.id==h.slice(2)))html=V.prod(P.find(p=>p.id==h.slice(2)));else html=(V[h]||V.home)();
$('#app').innerHTML=html;cc();document.title=(T[h]?'['+T[h].code+'] '+T[h].n+' – ':'')+'VietHaze – Sáp nước hoa 3 miền'}
addEventListener('hashchange',()=>{render();scrollTo(0,0)});render();
/* Chatbot (rule-based, miễn phí) */
const norm=s=>s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/đ/g,'d').toLowerCase();
const KB=[[/ba bau|me bim|bau|nhay cam/,'Sáp VietHaze làm từ sáp ong, dầu dừa, vitamin E và tinh dầu nguyên chất, không cồn, không chất bảo quản – an toàn cho da nhạy cảm, mẹ bầu và mẹ bỉm sữa 💚'],
[/thanh phan|nguyen lieu|organic/,'Thành phần: sáp ong, dầu dừa, vitamin E, tinh dầu nguyên chất. 100% thiên nhiên, không cồn, không phụ gia độc hại.'],
[/gia|bao nhieu|tien/,'Mỗi thỏi 5g giá '+money(PRICE)+'. Phí ship miễn phí từ 299.000đ.'],
[/ship|giao|van chuyen/,'Giao toàn quốc từ TP.HCM: nội thành 1–2 ngày, tỉnh khác 3–5 ngày.'],
[/doi tra|hoan/,'Đổi/trả trong 7 ngày nếu sản phẩm lỗi hoặc giao sai mùi.'],
[/thanh toan|cod|the|chuyen khoan/,'Bạn có thể chọn COD, chuyển khoản QR hoặc cổng thanh toán sandbox (thẻ test 4242 4242 4242 4242).'],
[/dung|cach|thoa|luu huong|ben/,'Vặn thỏi, thoa lên cổ tay, sau tai, cổ. Lưu hương dịu 4–6 tiếng (EDP). Hạn dùng 12 tháng, 6 tháng sau khi mở nắp.'],
[/ma vung|024|0234|028|y nghia/,'Mã sản phẩm theo mã vùng điện thoại bàn: 024 ẨM (Bắc), 0234 ẠM (Trung), 028 ÊM (Nam).'],
[/qua|tang/,'Làm quà thì 024 Quế (ấm áp, cuốn hút) hoặc 028 Hoa Sen (dịu dàng) rất hợp. Gợi ý: <a href="#p-024-que" style="color:#842E06">Quế</a> · <a href="#p-028-sen" style="color:#842E06">Hoa Sen</a>'],
[/que/,'Hương Quế 024 ấm nồng, cuốn hút, hợp ngày mưa lạnh &amp; hẹn hò tối. <a href="#p-024-que" style="color:#842E06">Xem →</a>'],[/nhai/,'Hương Nhài 024 thanh khiết, tinh tế. <a href="#p-024-nhai" style="color:#842E06">Xem →</a>'],
[/tram/,'Hương Tràm Gió 0234 thảo mộc, an yên như dầu tràm của bà. <a href="#p-0234-tram" style="color:#842E06">Xem →</a>'],[/thong/,'Gỗ Thông 0234 trầm tĩnh, tối giản. <a href="#p-0234-thong" style="color:#842E06">Xem →</a>'],
[/tao/,'Hương Táo 028 tươi mát, tràn năng lượng. <a href="#p-028-tao" style="color:#842E06">Xem →</a>'],[/sen/,'Hoa Sen 028 thanh tao, thư thái. <a href="#p-028-sen" style="color:#842E06">Xem →</a>'],
[/met|stress|thu gian|binh yen|ngu/,'Bạn đang cần thư giãn? Thử Tràm Gió (0234) hoặc Hoa Sen (028) nhé 🌿'],[/nang dong|tuoi|tre/,'Muốn tươi mới, năng động? Hương Táo 028 sẽ hợp với bạn 🍏'],[/xin chao|chao|hello|hi$/,'Chào bạn! Mình có thể gợi ý mùi hương theo tính cách, tâm trạng hay dịp tặng quà.']];
const chip=['Mùi nào hợp làm quà?','Mẹ bầu dùng được không?','Mã vùng nghĩa là gì?','Giá bao nhiêu?'];
$('#cq').innerHTML=chip.map(c=>`<span onclick="say('${c}')">${c}</span>`).join('');
function msg(t,c){$('#cm').insertAdjacentHTML('beforeend',`<p class="${c}">${t}</p>`);$('#cm').scrollTop=1e9}
function tg(){const w=$('#cw');w.style.display=w.style.display=='block'?'none':'block';if(!$('#cm').children.length)msg('Xin chào! Mình là trợ lý VietHaze 🐝 Bạn muốn tìm mùi hương nào?','bt')}
function say(q){msg(q.replace(/</g,'&lt;'),'us');const n=norm(q),r=KB.find(k=>k[0].test(n));setTimeout(()=>msg(r?r[1]:'Mình chưa rõ câu này. Bạn thử hỏi về mùi hương, giá, thành phần, giao hàng hoặc quà tặng nhé!','bt'),350)}
function ask(e){e.preventDefault();const v=$('#ci').value.trim();if(v){say(v);$('#ci').value=''}return false}
</script></body></html>
